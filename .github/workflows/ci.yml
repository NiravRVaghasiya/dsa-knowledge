name: CI

# Pull-request and push validation. Deployment lives in deploy.yml and only
# runs after this workflow's checks succeed (see deploy.yml `workflow_run`).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, validate, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # No package-lock.json in this repo (Bun is used locally), so we
        # run a fresh `npm install` which resolves platform-correct optional
        # deps (e.g. @rollup/rollup-linux-x64-gnu) on the CI runner.
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate content metadata
        run: npm run validate-content

      - name: Validate internal links
        run: npm run validate-links

      - name: Validate concept graph
        run: npm run validate-concepts

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        # Reused by the deploy workflow so we never build twice.
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build
          retention-days: 3
          if-no-files-found: error
